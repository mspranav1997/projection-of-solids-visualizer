<div class="app">
<aside class="card" id="ctl">
<h1>Projection of Solids</h1>
<label>Solid<select id="sol"></select></label>
<div class="row"><label id="lS">Base edge (mm)<input id="s" type="number" value="30" min="5"></label>
<label id="lD">Diameter (mm)<input id="d" type="number" value="40" min="5"></label>
<label id="lH">Axis length (mm)<input id="h" type="number" value="60" min="5"></label></div>
<label>Rests on<select id="pl"><option value="HP">HP (horizontal plane)</option><option value="VP">VP (vertical plane)</option></select></label>
<label>Touching the plane with<select id="ct"></select></label>
<div class="row"><label>Inclined to HP<select id="hpT"></select></label><label>Angle (°)<input id="hpA" type="number" value="45" min="1" max="90"></label></div>
<div class="row"><label>Inclined to VP<select id="vpT"></select></label><label>Angle (°)<input id="vpA" type="number" value="40" min="1" max="90"></label></div>

<label class="chk"><input type="checkbox" id="sv">Show side (profile) view</label>

<label class="chk"><input type="checkbox" id="lb" checked>Show vertex labels</label>
<div id="msg"></div><div id="res"></div>
<details id="dt"><summary>Edge table: true and apparent lengths</summary><div id="tb"></div></details>
</aside>
<main id="main">
<div class="card"><div id="bar"><button data-s="0">Start</button><button data-s="100">Stage 1</button><button data-s="200" class="on">Final</button>

<canvas id="cv2"></canvas></div>
